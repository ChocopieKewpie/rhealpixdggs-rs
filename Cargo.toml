[workspace]
members = [
    "crates/rhealpixdggs",
    "bindings/python",
]
resolver = "2"

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ChocopieKewpie/rhealpixdggs-rs"
authors = ["James Ardo"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
