[workspace]
members = [
    "crates/rhealpixdggs",
    "bindings/python",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/manaakiwhenua/rhealpixdggs-rs"
authors = ["rHEALPixDGGS Rust contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
