[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "rhealpixdggs-rs"
version = "0.9.0"
description = "Fast rHEALPix discrete global grid indexing powered by Rust"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "James Ardo" }]
keywords = ["DGGS", "rHEALPix", "geospatial", "Rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=8"]
geo = [
    "geopandas>=0.14,<2",
    "pyogrio>=0.7,<1",
    "shapely>=2,<3",
]
benchmark = [
    "geopandas>=0.14,<2",
    "pyogrio>=0.7,<1",
    "shapely>=2,<3",
]

[project.scripts]
rhealpix-to-gpkg = "rhealpixdggs.cli:main"

[project.urls]
Repository = "https://github.com/ChocopieKewpie/rhealpixdggs-rs"
Issues = "https://github.com/ChocopieKewpie/rhealpixdggs-rs/issues"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
module-name = "rhealpixdggs._rhealpixdggs"
python-source = "python"
features = ["pyo3/abi3-py39"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
