[package]
name = "rhealpixdggs"
description = "Fast, dependency-free rHEALPix discrete global grid indexing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
bench = false

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.11", optional = true }

[dev-dependencies]
criterion = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "indexing"
harness = false

[[bench]]
name = "bulk"
harness = false

[[bench]]
name = "topology"
harness = false

[lints]
workspace = true
