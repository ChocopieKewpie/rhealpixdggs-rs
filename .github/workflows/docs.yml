name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "examples/cas_crash_density.py"
      - "tools/check_documented_python_api.py"
      - "tools/generate_globe_data.py"
      - "tools/build_globe_pmtiles.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "examples/cas_crash_density.py"
      - "tools/check_documented_python_api.py"
      - "tools/generate_globe_data.py"
      - "tools/build_globe_pmtiles.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_RHEALPIX_PMTILES_URL: ${{ vars.PUBLIC_RHEALPIX_PMTILES_URL }}
      PUBLIC_RHEALPIX_GRID_PMTILES_URL: ${{ vars.PUBLIC_RHEALPIX_GRID_PMTILES_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_documented_python_api.py
      - name: Install, build, and upload the Starlight site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
