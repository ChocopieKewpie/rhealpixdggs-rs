name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test -p rhealpixdggs
      - run: cargo check -p rhealpixdggs-python

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: Install the locally built wheel
        run: python -m pip install --no-index --no-deps --find-links dist "rhealpixdggs-rs==0.8.1"
      - name: Verify installed package
        run: python -c "import rhealpixdggs as rh; assert rh.__version__ == '0.8.1'"
      - run: python -m pytest

  python-geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - name: Install geospatial test dependencies
        run: >-
          python -m pip install pytest numpy
          "geopandas>=0.14,<2" "pyogrio>=0.7,<1" "shapely>=2,<3"
      - name: Install the locally built wheel
        run: python -m pip install --no-index --no-deps --find-links dist "rhealpixdggs-rs==0.8.1"
      - name: Run GeoPackage adapter tests
        run: python -m pytest tests/python/test_geo.py
